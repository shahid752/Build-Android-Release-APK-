name: Build Android Release APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Install Project Dependencies
        working-directory: ./intelligent-pasteur
        run: flutter pub get

      - name: Build Release APK
        working-directory: ./intelligent-pasteur
        run: flutter build apk --release

      - name: Upload APK as Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CampusSchedule-release-apk
          path: intelligent-pasteur/build/app/outputs/flutter-apk/app-release.apk
