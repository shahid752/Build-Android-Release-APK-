name: Build Android Release APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Assemble and Build APK
        run: |
          # 1. Generate clean official Flutter Android template
          flutter create -t app --org com.example --project-name campus_schedule clean_project

          # 2. Locate uploaded source folder
          SRC_DIR="."
          if [ -d "intelligent-pasteur" ]; then
            SRC_DIR="intelligent-pasteur"
          fi

          # 3. Copy our Dart source code and dependencies into clean template
          cp -rf "$SRC_DIR/lib" clean_project/
          cp -f "$SRC_DIR/pubspec.yaml" clean_project/
          
          # Fix CrossAxisAlignment automatically in all files
          find clean_project/lib -type f -name "*.dart" -exec sed -i 's/CrossCrossConstraints/CrossAxisAlignment/g' {} +

          # Copy custom AndroidManifest with exact alarm permissions
          if [ -f "$SRC_DIR/android/app/src/main/AndroidManifest.xml" ]; then
            cp -f "$SRC_DIR/android/app/src/main/AndroidManifest.xml" clean_project/android/app/src/main/AndroidManifest.xml
          fi

          # 4. Build release APK
          cd clean_project
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK as Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CampusSchedule-release-apk
          path: clean_project/build/app/outputs/flutter-apk/app-release.apk
